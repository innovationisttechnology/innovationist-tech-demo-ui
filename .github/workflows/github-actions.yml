name: CI / CD
run-name: ${{ github.ref_name == 'main' && 'Deploy' || 'Build' }} ${{ github.ref_name }} by ${{ github.actor }}

on:
  push:
    branches:
      - main
      - "feature/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check required secrets
        if: github.ref_name == 'main'
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          ZIZA_API_URL: ${{ secrets.ZIZA_API_URL }}
          ZIZA_DEMO_SERVER_SECRET: ${{ secrets.ZIZA_DEMO_SERVER_SECRET }}
        run: |
          missing=""
          for name in DOCKER_USERNAME DOCKER_PASSWORD NEXT_PUBLIC_API_BASE_URL \
            EC2_HOST EC2_USER EC2_SSH_KEY ZIZA_API_URL ZIZA_DEMO_SERVER_SECRET; do
            if [ -z "${!name}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Required secrets are empty:$missing"
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.ref_name == 'main' }}
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ secrets.NEXT_PUBLIC_API_BASE_URL }}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/innovationist-tech-demo-ui:latest
            ${{ secrets.DOCKER_USERNAME }}/innovationist-tech-demo-ui:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref_name == 'main'
    steps:
      - name: Deploy on EC2 (pull + restart container)
        uses: appleboy/ssh-action@v1.2.5
        # Exported into the remote shell by `envs`, then handed to the
        # container by name, so no value appears in the script or `ps`.
        env:
          ZIZA_API_URL: ${{ secrets.ZIZA_API_URL }}
          ZIZA_DEMO_SERVER_SECRET: ${{ secrets.ZIZA_DEMO_SERVER_SECRET }}
          ZIZA_CLIENT_IP_HEADER: ${{ secrets.ZIZA_CLIENT_IP_HEADER }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: ZIZA_API_URL,ZIZA_DEMO_SERVER_SECRET,ZIZA_CLIENT_IP_HEADER
          script: |
            set -e
            IMAGE="${{ secrets.DOCKER_USERNAME }}/innovationist-tech-demo-ui:latest"
            CONTAINER="innovationist-tech-demo-ui"

            # Authenticate without exposing the password in the process list.
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

            docker pull "$IMAGE"

            # Optional: unset means the BFF's default (x-real-ip). Passed only
            # when set, since an empty value would replace that default.
            set --
            if [ -n "$ZIZA_CLIENT_IP_HEADER" ]; then
              set -- -e ZIZA_CLIENT_IP_HEADER
            fi

            docker stop "$CONTAINER" || true
            docker rm "$CONTAINER" || true

            docker run -d \
              --name "$CONTAINER" \
              --restart unless-stopped \
              -p 3001:3001 \
              --add-host=host.docker.internal:host-gateway \
              -e ZIZA_API_URL \
              -e ZIZA_DEMO_SERVER_SECRET \
              "$@" \
              "$IMAGE"

            # Wait for the container to report healthy/running; roll back is manual but
            # at least fail the deploy loudly if it crashes on boot.
            sleep 5
            if [ "$(docker inspect -f '{{.State.Running}}' "$CONTAINER")" != "true" ]; then
              echo "Container failed to start:"
              docker logs --tail 50 "$CONTAINER" || true
              exit 1
            fi

            docker image prune -f
